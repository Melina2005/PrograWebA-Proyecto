<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador | Distrito Cosmetico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">

        <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/adminModule.js" defer type="module"></script>
    <script src="js/components.js" defer></script>
    <script src="js/sesion.js" defer></script>
</head>
<body>

      <!-- Header Desktop -->
    <div id="header"></div>

    <!-- Menú Mobile -->
    <div id="mobile-menu"></div>

    <main class="container py-5">

        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">
                Panel de Administrador
            </h1>

            <p class="lead text-muted">
                Gestión de productos y seguimiento de órdenes.
            </p>
        </div>

        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-productos-btn" data-bs-toggle="tab" data-bs-target="#tab-productos" type="button" role="tab">
                    Productos
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-ordenes-btn" data-bs-toggle="tab" data-bs-target="#tab-ordenes" type="button" role="tab">
                    Órdenes
                </button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">
            <div class="tab-pane fade show active" id="tab-productos" role="tabpanel">
                <div class="d-flex justify-content-end mb-3">
                    <button class="btn btn-dark text-white rounded-pill px-4" id="btn-nuevo-producto">
                        <i class="bi bi-plus-lg me-2"></i>Nuevo Producto
                    </button>
                </div>
                <div id="admin-productos-container"></div>
            </div>
            <div class="tab-pane fade" id="tab-ordenes" role="tabpanel">
                <div id="admin-ordenes-container"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <div class="modal fade" id="productoFormModal" tabindex="-1" aria-labelledby="productoFormModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header header-top text-dark">
                    <h5 class="modal-title fw-bold" id="productoFormModalLabel">Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="form-producto">
                        <input type="hidden" id="form-id">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="form-nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" id="form-categoria" required>
                                <option value="Maquillaje">Maquillaje</option>
                                <option value="Skincare">Skincare</option>
                                <option value="Cabello">Cabello</option>
                                <option value="Fragancias">Fragancias</option>
                                <option value="Corporal">Corporal</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio (₡)</label>
                            <input type="number" class="form-control" id="form-precio" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Cantidad disponible (stock)</label>
                            <input type="number" class="form-control" id="form-stock" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="form-descripcion" rows="2" required></textarea>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="form-disponible">
                            <label class="form-check-label" for="form-disponible">Disponible para la venta</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer footer-bar border-0">
                    <button type="button" class="btn btn-outline-dark rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-dark text-white rounded-pill px-4" id="btn-guardar-producto">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="ordenDetalleModal" tabindex="-1" aria-labelledby="ordenDetalleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header header-top text-dark">
                    <h5 class="modal-title fw-bold" id="ordenDetalleModalLabel">Detalle de la Orden</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="orden-detalle-body">
                    <!-- Contenido generado dinámicamente -->
                </div>
                <div class="modal-footer footer-bar border-0">
                    <button type="button" class="btn btn-outline-dark rounded-pill px-4" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
