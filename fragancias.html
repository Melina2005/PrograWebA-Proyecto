<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fragancias | Distrito Cosmetico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="css/style.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    
    <script src="js/components.js" defer></script>
    <script src="js/sesion.js" defer></script>
    <script src="js/script.js" defer type="module"></script>
</head>

<body>

   <!-- Header Desktop -->
    <div id="header"></div>

    <!-- Menú Mobile -->
    <div id="mobile-menu"></div>

    <main class="container py-5">

        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">
                Fragancias
            </h1>

            <p class="lead text-muted">
                Encuentra tu aroma ideal entre nuestras fragancias exclusivas.
            </p>
        </div>

        <div class="row g-4" id="productos-container">
        </div>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header header-top text-dark">
                    <h5 class="modal-title fw-bold" id="modal-titulo">Nombre del Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-center">
                    <div class="product-img-wrapper mb-3 mx-auto" style="max-width: 200px; height: 200px;">
                        <img id="modal-img" src="" alt="" class="img-fluid">
                    </div>
                    <span id="modal-categoria" class="badge bg-secondary mb-2">Categoria</span>
                    <h3 id="modal-precio" class="text-primary fw-bold mb-3">₡0</h3>
                    <p id="modal-descripcion" class="text-muted">Descripción</p>
                    <span id="modal-disponibilidad"
                        class="badge badge-disponibilidad p-2 px-3 rounded-pill mt-2">Disponible</span>
                </div>
                <div class="modal-footer footer-bar border-0 justify-content-center">
                    <button type="button" class="btn btn-dark text-white rounded-pill px-4"><i
                            class="bi bi-cart-plus me-2"></i>Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
