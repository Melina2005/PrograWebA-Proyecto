<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distrito Cosmetico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/sesion.js" defer></script>
    <script src="js/script.js" defer type="module"></script>
    <script src="js/components.js" defer></script>

</head>

<body>

    <!-- Header Desktop -->
    <div id="header"></div>

    <!-- Menú Mobile -->
    <div id="mobile-menu"></div>

    <main class="container py-4">

        <section class="row g-3 mb-5">
            <div class="col-12 col-md-4">
                <div class="hero-banner"><img src="img/promoMaquillaje.jpeg" alt="Promoción maquillaje"
                        class="img-fluid"></div>
            </div>
            <div class="col-12 col-md-4">
                <div class="hero-banner"><img src="img/SkincarePromo.jpg" alt="Promoción cuidados" class="img-fluid">
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="hero-banner d-none d-md-block"><img src="img/promoPerfume.webp" alt="Promoción accesorios"
                        class="img-fluid"></div>
            </div>
        </section>

        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-end mb-3">
                <h2 class="section-title fs-4 mb-0">Más vendidos</h2>
                <a href="mas-vendidos.html"
                    class="text-decoration-none d-none d-lg-inline-flex align-items-center link-explorar">
                    Explorar más
                    <i class="bi bi-arrow-right-circle ms-2 fs-5"></i>
                </a>
            </div>
            <div class="scroll-container" id="mas-vendidos-container">
            </div>
        </section>

        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-end mb-3">
                <h2 class="section-title fs-4 mb-0">Nuevos Productos</h2>
                <a href="nuevos-productos.html"
                    class="text-decoration-none d-none d-lg-inline-flex align-items-center link-explorar">
                    Explorar más <i class="bi bi-arrow-right-circle ms-2 fs-5"></i>
                </a>
            </div>
            <div class="scroll-container" id="nuevos-productos-container">
            </div>
        </section>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Modal -->
     <div id="product-modal"></div>

</body>

</html>
