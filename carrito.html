<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Distrito Cosmético</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js" defer></script>
    <script src="js/sesion.js" defer></script>
    <script src="js/script.js" defer type="module"></script>

</head>

<body>

    <!-- Header Desktop -->
    <div id="header"></div>

    <!-- Menú Mobile -->
    <div id="mobile-menu"></div>

    <main class="container py-5">
        <div class="d-flex align-items-center justify-content-between mb-5">
            <h1 class="mb-0">Mi Carrito</h1>
            <a href="index.html" class="btn btn-outline-secondary">Seguir comprando</a>
        </div>

        <div class="card shadow border-0">
            <div class="card-body">
                <div id="carrito-vacio" class="text-center py-5 d-none">
                    <i class="bi bi-cart-x display-4 text-muted"></i>
                    <p class="lead text-muted mt-3 mb-0">Tu carrito está vacío.</p>
                    <a href="index.html" class="btn btn-dark mt-4">Explorar productos</a>
                </div>

                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th><span class="visually-hidden">Acciones</span></th>
                            </tr>
                        </thead>
                        <tbody id="carrito-body"></tbody>
                    </table>
                </div>

                <div id="carrito-resumen" class="d-none">
                    <hr>
                    <div class="d-flex justify-content-end align-items-center gap-3">
                        <h4 class="mb-0">Total:</h4>
                        <h4 id="carrito-total" class="mb-0">₡0</h4>
                    </div>
                    <div class="d-flex flex-column flex-md-row gap-3 mt-4">
                        <button id="btn-vaciar-carrito" class="btn btn-outline-danger flex-fill">Vaciar carrito</button>
                        <button id="btn-finalizar-compra" class="btn btn-success flex-fill">Finalizar compra</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

</body>

</html>
